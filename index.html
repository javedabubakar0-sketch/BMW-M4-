<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PROJECT V • High-Performance Automotive Launch Platform</title>
  <meta name="description" content="Project V Engineering Study 01: Discover every system, surface and aerodynamic decision behind the machine.">

  <!-- Google Fonts: Syne, Outfit, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Preloader Critical CSS */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #050505;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 600ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .preloader-brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.3em;
      color: #ffffff;
    }
    .preloader-brand span {
      color: #e5b80b;
    }
    .preloader-bar-wrap {
      width: 240px;
      height: 2px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
    }
    .preloader-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #e5b80b;
      box-shadow: 0 0 10px rgba(229, 184, 11, 0.5);
      transition: width 150ms ease-out;
    }
    .preloader-subtext {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: #79808d;
    }
  </style>
</head>
<body class="theme-carbon_night">

  <!-- Cinematic Preloader -->
  <div id="preloader">
    <div class="preloader-brand">PROJECT <span>V</span></div>
    <div class="preloader-bar-wrap">
      <div class="preloader-bar-fill" id="preloader-bar"></div>
    </div>
    <div class="preloader-subtext" id="preloader-text">INITIALIZING ENGINEERING MODEL 0%</div>
  </div>

  <div id="app">
    <!-- Sticky Canvas Stage -->
    <div class="stage-container">
      <canvas id="car-canvas"></canvas>
    </div>

    <!-- UI Overlay Mounting Roots -->
    <header id="nav-root"></header>
    <main>
      <div id="hero-root"></div>
      <div id="scrolly-root"></div>
      <div id="inspection-root"></div>
      <div id="trackbar-root"></div>
      <div id="lighting-root"></div>
      <div id="configurator-root"></div>
      <div id="cockpit-root"></div>
      <div id="gallery-root"></div>

      <!-- Long Scroll Spacer for 11 Scrollytelling Phases -->
      <div class="scroll-track"></div>

      <!-- VIP Luxury Footer Section -->
      <div id="footer-root"></div>
    </main>
  </div>

  <!-- Interactive Desktop Cursor -->
  <div class="custom-cursor" id="custom-cursor"></div>

  <!-- Entry Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
